<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#2d0f0f;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4a1515;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A84C;stop-opacity:0.3" />
    </linearGradient>

    <!-- Hill gradient -->
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#8B0000;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff0001;stop-opacity:0.3" />
    </linearGradient>

    <!-- Mountain gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ff0001;stop-opacity:0.2" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" mode="multiply" />
    </filter>
  </defs>

  <!-- Background sky -->
  <rect width="1200" height="1600" fill="url(#skyGrad)" />

  <!-- Distant mountains layer 1 -->
  <path d="M0,800 L200,600 L400,750 L600,550 L800,700 L1000,500 L1200,650 L1200,1600 L0,1600 Z"
        fill="#1a0505" opacity="0.7" />

  <!-- Distant mountains layer 2 -->
  <path d="M0,900 L150,700 L350,850 L550,650 L750,800 L950,600 L1200,750 L1200,1600 L0,1600 Z"
        fill="url(#mountainGrad)" opacity="0.5" />

  <!-- Sacred geometry overlay - hidden pattern -->
  <g opacity="0.03">
    <circle cx="600" cy="400" r="300" fill="none" stroke="#ff0001" stroke-width="2" />
    <circle cx="600" cy="400" r="250" fill="none" stroke="#C9A84C" stroke-width="1" />
    <line x1="300" y1="400" x2="900" y2="400" stroke="#ff0001" stroke-width="1" />
    <line x1="600" y1="100" x2="600" y2="700" stroke="#ff0001" stroke-width="1" />
  </g>

  <!-- Mid-ground hills -->
  <path d="M0,1100 C300,1000 500,1050 800,950 C1000,900 1100,950 1200,1000 L1200,1600 L0,1600 Z"
        fill="url(#hillGrad)" opacity="0.6" />

  <!-- Main hill/mountain -->
  <path d="M0,1300 C200,1150 400,1200 600,1100 C800,1000 1000,1050 1200,1150 L1200,1600 L0,1600 Z"
        fill="#2d0a0a" opacity="0.8" />

  <!-- Golden peak highlight -->
  <path d="M550,1100 C580,1050 620,1050 650,1100 C620,1080 580,1080 550,1100 Z"
        fill="#C9A84C" opacity="0.9" filter="url(#glow)" />

  <!-- Foreground field -->
  <path d="M0,1400 C300,1350 600,1380 900,1320 C1000,1300 1100,1320 1200,1350 L1200,1600 L0,1600 Z"
        fill="#0a0000" opacity="0.9" />

  <!-- Field texture lines -->
  <g stroke="#ff0001" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="1420" x2="1200" y2="1380" />
    <line x1="0" y1="1440" x2="1200" y2="1400" />
    <line x1="0" y1="1460" x2="1200" y2="1420" />
    <line x1="0" y1="1480" x2="1200" y2="1440" />
    <line x1="0" y1="1500" x2="1200" y2="1460" />
  </g>

  <!-- Foreground branch/tree - left side -->
  <g filter="url(#shadow)">
    <path d="M0,200 Q150,250 300,150 T500,100"
          fill="none" stroke="#0a0000" stroke-width="12" stroke-linecap="round" />
    <path d="M0,200 Q150,250 300,150 T500,100"
          fill="none" stroke="#1a0505" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Leaves on branch -->
  <g>
    <circle cx="180" cy="230" r="6" fill="#C9A84C" opacity="0.9" />
    <circle cx="220" cy="210" r="5" fill="#ff0001" opacity="0.85" />
    <circle cx="260" cy="195" r="7" fill="#8B0000" opacity="0.8" />
    <circle cx="300" cy="180" r="5" fill="#C9A84C" opacity="0.9" />
    <circle cx="340" cy="160" r="6" fill="#ff0001" opacity="0.85" />
    <circle cx="380" cy="145" r="4" fill="#C9A84C" opacity="0.9" />
    <circle cx="420" cy="130" r="5" fill="#8B0000" opacity="0.8" />
    <circle cx="460" cy="115" r="6" fill="#ff0001" opacity="0.85" />
    <circle cx="200" cy="250" r="4" fill="#8B0000" opacity="0.75" />
    <circle cx="240" cy="235" r="5" fill="#C9A84C" opacity="0.85" />
    <circle cx="280" cy="220" r="4" fill="#ff0001" opacity="0.8" />
    <circle cx="320" cy="205" r="6" fill="#8B0000" opacity="0.85" />
    <circle cx="360" cy="188" r="5" fill="#C9A84C" opacity="0.9" />
    <circle cx="400" cy="170" r="4" fill="#ff0001" opacity="0.8" />
    <circle cx="440" cy="155" r="5" fill="#8B0000" opacity="0.85" />
    <circle cx="170" cy="240" r="5" fill="#ff0001" opacity="0.8" />
    <circle cx="250" cy="225" r="6" fill="#C9A84C" opacity="0.9" />
    <circle cx="290" cy="208" r="4" fill="#8B0000" opacity="0.75" />
    <circle cx="330" cy="192" r="5" fill="#ff0001" opacity="0.85" />
    <circle cx="370" cy="175" r="6" fill="#C9A84C" opacity="0.9" />
    <circle cx="410" cy="158" r="4" fill="#8B0000" opacity="0.8" />
    <circle cx="450" cy="140" r="5" fill="#ff0001" opacity="0.85" />
  </g>

  <!-- Central sacred geometry relic form -->
  <g transform="translate(600, 700)" opacity="0.9">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#ff0001" stroke-width="1.5" opacity="0.5" />

    <!-- Inner geometry -->
    <polygon points="0,-80 69,40 -69,40" fill="none" stroke="#C9A84C" stroke-width="2" opacity="0.7" />
    <polygon points="0,80 69,-40 -69,-40" fill="none" stroke="#ff0001" stroke-width="1.5" opacity="0.6" />

    <!-- Center point -->
    <circle cx="0" cy="0" r="8" fill="#C9A84C" opacity="0.9" filter="url(#glow)" />
    <circle cx="0" cy="0" r="4" fill="#ff0001" opacity="1" />
  </g>

  <!-- Subtle grain overlay -->
  <rect width="1200" height="1600" filter="url(#noise)" opacity="0.03" />

  <!-- Signature -->
  <text x="1140" y="1580" font-family="Cinzel, serif" font-size="14" fill="#C9A84C" opacity="0.6" text-anchor="end">RED ARCHITECTURE</text>
</svg>

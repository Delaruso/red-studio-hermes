<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <!-- Premium black cotton texture -->
    <pattern id="cotton" patternUnits="userSpaceOnUse" width="3" height="3">
      <rect width="3" height="3" fill="#080808"/>
      <circle cx="1" cy="1" r="0.3" fill="#0d0d0d"/>
      <circle cx="2" cy="2" r="0.2" fill="#111111"/>
    </pattern>
    
    <!-- Red wax gradient with gold flecks -->
    <radialGradient id="wax" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cc0000"/>
      <stop offset="70%" stop-color="#990000"/>
      <stop offset="100%" stop-color="#660000"/>
    </radialGradient>
    
    <!-- Gold foil gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#E5C77A"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    
    <style>
      .envelope-cut { stroke: #333333; stroke-width: 0.5; fill: none; }
      .envelope-fold { stroke: #C9A84C; stroke-width: 0.3; fill: none; stroke-dasharray: 1,1; }
      .guide { stroke: #222222; stroke-width: 0.2; fill: none; }
      .seal { fill: url(#wax); opacity: 0.9; }
      .sigil-engrave { stroke: #ffcccc; stroke-width: 1.5; fill: none; opacity: 0.7; }
      .text-entity { font-family: 'Didot', 'Bodoni MT', 'Noto Serif Display', serif; font-size: 9px; fill: #1a1a1a; letter-spacing: 3; }
      .text-label { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-size: 7px; fill: #666666; letter-spacing: 2; }
    </style>
  </defs>
  
  <!-- Background: premium black cotton -->
  <rect width="800" height="600" fill="url(#cotton)"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#C9A84C" letter-spacing="5">CIPHER ENVELOPE — PROFESSIONAL SPECIFICATION</text>
  
  <!-- Envelope outer: A5+ oversized -->
  <rect x="120" y="70" width="560" height="400" class="envelope-cut" rx="1"/>
  
  <!-- Back flap fold lines -->
  <line x1="120" y1="70" x2="400" y2="300" class="envelope-fold"/>
  <line x1="400" y1="300" x2="680" y2="70" class="envelope-fold"/>
  
  <!-- Side folds -->
  <line x1="120" y1="70" x2="120" y2="470" class="envelope-fold"/>
  <line x1="680" y1="70" x2="680" y2="470" class="envelope-fold"/>
  
  <!-- Bottom fold -->
  <line x1="120" y1="470" x2="680" y2="470" class="envelope-fold"/>
  
  <!-- Inner liner -->
  <rect x="140" y="90" width="520" height="360" class="guide" rx="0.5"/>
  
  <!-- ENTITY NAME POSITION (bottom center, small caps, wide tracking) -->
  <text x="400" y="445" text-anchor="middle" class="text-entity">ENTITY NAME</text>
  <line x1="340" y1="450" x2="460" y2="450" stroke="#1a1a1a" stroke-width="0.3"/>
  
  <!-- WAX SEAL PLACEMENT (back flap, centered, 80mm from bottom) -->
  <circle cx="400" cy="200" r="42" class="guide"/>
  <text x="400" y="195" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666666">WAX SEAL</text>
  <text x="400" y="207" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#666666">PLACEMENT</text>
  
  <!-- Sigil preview in seal: engraved style, not filled -->
  <g transform="translate(400, 200)" opacity="0.5">
    <circle cx="0" cy="0" r="32" class="sigil-engrave"/>
    <line x1="-32" y1="0" x2="32" y2="0" class="sigil-engrave"/>
    <circle cx="0" cy="0" r="3" fill="#ffcccc" opacity="0.5"/>
    <line x1="-38" y1="-6" x2="-38" y2="6" stroke="#ffcccc" stroke-width="1" opacity="0.4"/>
    <line x1="38" y1="-6" x2="38" y2="6" stroke="#ffcccc" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- INTERIOR LAYOUT (shown as ghosted rectangle) -->
  <rect x="140" y="90" width="520" height="360" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5"/>
  
  <!-- Blind deboss sigil (top center of interior) -->
  <g transform="translate(400, 140)" opacity="0.15">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#000000" stroke-width="0.5"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#000000" stroke-width="0.5"/>
  </g>
  
  <!-- QR code position (gold foil, bottom right) -->
  <rect x="590" y="400" width="50" height="50" fill="none" stroke="#C9A84C" stroke-width="0.3" stroke-dasharray="2,2"/>
  <text x="615" y="395" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#C9A84C" opacity="0.6">GOLD FOIL</text>
  
  <!-- Dimensions and specs -->
  <text x="400" y="500" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#C9A84C" letter-spacing="2">
    A5+ 230MM × 165MM | 200GSM BLACK COTTON | MATTE FINISH
  </text>
  <text x="400" y="520" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#666666" letter-spacing="1">
    WAX SEAL: HAND-POURED RED WITH GOLD FLECKS | QR: GOLD FOIL STAMP | NO OTHER INK ON EXTERIOR
  </text>
  <text x="400" y="540" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#444444">
    TYPOGRAPHY: DIDOT / BODONI 9PT SMALL CAPS +200 TRACKING | DARK GRAY #1A1A1A | BOTTOM CENTER ONLY
  </text>
  <text x="400" y="555" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#444444">
    INTERIOR: WHITE COTTON 100LB | BLIND DEBOSS SIGIL | ENTITY NAME WATERMARK | QR FOIL STAMP
  </text>
  
  <!-- Corner marks -->
  <g stroke="#C9A84C" stroke-width="0.3" fill="none">
    <path d="M 110 80 L 130 80 M 110 80 L 110 100"/>
    <path d="M 670 80 L 690 80 M 690 80 L 690 100"/>
    <path d="M 110 460 L 130 460 M 110 460 L 110 440"/>
    <path d="M 670 460 L 690 460 M 690 460 L 690 440"/>
  </g>
</svg>
